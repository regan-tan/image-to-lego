
name: Publish bootstrap images

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOYMENT_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to container registry
        run: az acr login --name itl2b70703f

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend and frontend
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="itl2b70703f.azurecr.io"

          docker buildx build --push \
            -t "$REGISTRY/image-to-lego-backend:$SHA" \
            backend

          docker buildx build --push \
            -f frontend/Dockerfile \
            -t "$REGISTRY/image-to-lego-frontend:$SHA" \
            .

          echo "Published image tag: $SHA" >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Previously published 40-character commit SHA to redeploy.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull-request validation may be superseded, but a main-branch release must
  # never be cancelled after it has changed Azure resources.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips unaffected jobs with job-level `if` rather than workflow `paths`, because GitHub
  # treats a skipped job as passing, so required status checks never wait forever.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
      application: ${{ steps.filter.outputs.application }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            echo "application=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # On pull requests HEAD is GitHub's merge commit; its first parent is the base branch.
            changed_files="$(git diff --name-only HEAD^1 HEAD)"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$AFTER_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          fi
          echo "Changed files:"
          echo "$changed_files"

          backend=false
          frontend=false
          terraform=false
          application=false
          if grep -qE '^(backend/|supabase/migrations/|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            backend=true
          fi
          if grep -qE '^(frontend/|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            frontend=true
          fi
          if grep -qE '^(infra/terraform/|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            terraform=true
          fi
          if grep -qE '^(backend/|frontend/)' <<< "$changed_files"; then
            application=true
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "terraform=$terraform" >> "$GITHUB_OUTPUT"
          echo "application=$application" >> "$GITHUB_OUTPUT"
          if [ "$application" = "false" ]; then
            echo "### Application deployment not required" >> "$GITHUB_STEP_SUMMARY"
            echo "No backend or frontend source changed; Azure deployment was not requested." >> "$GITHUB_STEP_SUMMARY"
          fi

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        run: uv run pytest -q

  backend-image:
    name: Backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate backend image build
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: image-to-lego-api:ci

  backend-postgres:
    name: Backend PostgreSQL integration
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: image_to_lego_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d image_to_lego_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Apply release migrations and run concurrency tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/image_to_lego_test
          REQUIRE_POSTGRES_INTEGRATION: "true"
        run: |
          set -euo pipefail
          output="$(uv run pytest -q -rA tests/test_worker_release_postgres.py)"
          printf '%s\n' "$output"
          if grep --fixed-strings --quiet "SKIPPED" <<< "$output"; then
            echo "PostgreSQL integration tests must not be skipped in CI." >&2
            exit 1
          fi

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm run test -- --run
      - name: Production build
        run: npm run build

  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [shared, application-compute]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without remote state
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate

  release-safety:
    name: Release safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify release safeguards
        shell: pwsh
        run: |
          ./scripts/Assert-WorkerReleaseSafety.Tests.ps1
          ./scripts/Test-ReleaseWorkflow.ps1

  deploy-development:
    name: Deploy development
    needs: [changes, backend, backend-image, backend-postgres, frontend, terraform, release-safety]
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) &&
      needs.changes.result == 'success' && needs.changes.outputs.application == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.backend-image.result == 'success' || needs.backend-image.result == 'skipped') &&
      (needs.backend-postgres.result == 'success' || needs.backend-postgres.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: azure-development-deployment
      # A release is a stateful operation. Never cancel a running deployment in
      # favor of a later push; the later run waits and deploys its own SHA.
      cancel-in-progress: false
    env:
      AZURE_RESOURCE_GROUP: rg-image-to-lego-dev
      AZURE_ACR_NAME: itl2b70703f
      AZURE_API_NAME: app-image-to-lego-api-dev-2b70703f
      AZURE_FRONTEND_NAME: ca-frontend-image-to-lego-dev
      AZURE_GENERATION_WORKER_NAME: aci-image-to-lego-generation-dev
      AZURE_CONVERSION_WORKER_NAME: aci-image-to-lego-conversion-dev
      AZURE_KEY_VAULT_URL: https://kv-itl-2b70703f.vault.azure.net/
      AZURE_DEPLOYMENT_CLIENT_ID: ${{ vars.AZURE_DEPLOYMENT_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACI_WORKER_RELEASES_ENABLED: ${{ vars.ACI_WORKER_RELEASES_ENABLED }}
      AZURE_COMPUTE_DEPLOYMENTS_ENABLED: ${{ vars.AZURE_COMPUTE_DEPLOYMENTS_ENABLED }}
      # Activation requires a reviewed workflow change. A repository variable alone
      # must never turn this inactive controller foundation into Azure mutations.
      RELEASE_CONTROLLER_AZURE_MUTATIONS_ENABLED: "false"
      DEPLOYMENT_DATABASE_URL: ${{ secrets.DEPLOYMENT_DATABASE_URL }}
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check release mode
        id: release-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$AZURE_COMPUTE_DEPLOYMENTS_ENABLED" == "true" && "$RELEASE_CONTROLLER_AZURE_MUTATIONS_ENABLED" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "AZURE_COMPUTE_DEPLOYMENTS_ENABLED=true is required before a manual redeployment or rollback." >&2
            exit 1
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Azure deployment intentionally disabled
          - Commit: \`$RELEASE_SHA\`
          - CI validation completed, but no Azure image was published and no compute resource was changed.
          - This workflow has no reviewed Azure controller adapter; its code-reviewed activation boundary remains false.
          EOF
      - name: Log in to Azure with GitHub OIDC
        if: steps.release-mode.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_DEPLOYMENT_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Preflight compute and release safety
        if: steps.release-mode.outputs.enabled == 'true'
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

          subscription_resource="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers"
          resources=(
            "$subscription_resource/Microsoft.Web/serverFarms/ASP-rgimagetolegodev-8295"
            "$subscription_resource/Microsoft.Web/sites/$AZURE_API_NAME"
            "$subscription_resource/Microsoft.ContainerInstance/containerGroups/$AZURE_GENERATION_WORKER_NAME"
            "$subscription_resource/Microsoft.ContainerInstance/containerGroups/$AZURE_CONVERSION_WORKER_NAME"
            "$subscription_resource/Microsoft.App/containerApps/$AZURE_FRONTEND_NAME"
          )
          missing=()
          for resource_id in "${resources[@]}"; do
            if ! az resource show --ids "$resource_id" --only-show-errors >/dev/null 2>&1; then
              missing+=("$resource_id")
            fi
          done
          if ((${#missing[@]})); then
            echo "### Deployment prerequisite missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Compute is unavailable; no image was published or resource changed." >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "${missing[@]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$ACI_WORKER_RELEASES_ENABLED" != "true" ]]; then
            echo "Set ACI_WORKER_RELEASES_ENABLED=true only after the bootstrap inventory and smoke test in the lifecycle runbook." >&2
            exit 1
          fi

          submissions_enabled="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_API_NAME" --query "[?name=='JOB_SUBMISSIONS_ENABLED'].value | [0]" --output tsv)"
          if [[ "$submissions_enabled" != "false" ]]; then
            echo "JOB_SUBMISSIONS_ENABLED must remain false for automated releases." >&2
            exit 1
          fi

          if [[ -z "$DEPLOYMENT_DATABASE_URL" ]] || ! command -v psql >/dev/null; then
            echo "DEPLOYMENT_DATABASE_URL and psql are required to prove no worker lease is in flight." >&2
            exit 1
          fi
          active_attempts="$(psql "$DEPLOYMENT_DATABASE_URL" -X --tuples-only --no-align --set=ON_ERROR_STOP=1 -c 'select public.worker_release_active_attempt_count();')"
          if [[ ! "$active_attempts" =~ ^[0-9]+$ ]]; then
            echo "The worker release lease query returned an invalid count." >&2
            exit 1
          fi
          registry_server="$(az acr show --name "$AZURE_ACR_NAME" --query loginServer --output tsv)"
          namespace="image-to-lego-bus-dev-01"
          queue_counts="$(az servicebus queue show --resource-group "$AZURE_RESOURCE_GROUP" --namespace-name "$namespace" --name generation --query '{active:countDetails.activeMessageCount,scheduled:countDetails.scheduledMessageCount}' --output tsv; az servicebus queue show --resource-group "$AZURE_RESOURCE_GROUP" --namespace-name "$namespace" --name conversion --query '{active:countDetails.activeMessageCount,scheduled:countDetails.scheduledMessageCount}' --output tsv)"
          active_messages="$(awk '{active += $1} END {print active}' <<< "$queue_counts")"
          scheduled_messages="$(awk '{scheduled += $2} END {print scheduled}' <<< "$queue_counts")"

          api_principal_id="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name id-image-to-lego-api-dev --query principalId --output tsv)"
          generation_principal_id="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name id-image-to-lego-generation-dev --query principalId --output tsv)"
          conversion_principal_id="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name id-image-to-lego-conversion-dev --query principalId --output tsv)"
          queue_senders_verified=true
          for expected in "generation:$api_principal_id:$generation_principal_id" "conversion:$api_principal_id:$conversion_principal_id"; do
            queue_name="${expected%%:*}"; expected_ids="${expected#*:}"
            actual_ids="$(az role assignment list --all --include-inherited --scope "$subscription_resource/Microsoft.ServiceBus/namespaces/$namespace/queues/$queue_name" --query "[?roleDefinitionName=='Azure Service Bus Data Sender'].principalId" --output tsv | sort -u | tr '\n' ':')"
            wanted_ids="$(tr ':' '\n' <<< "$expected_ids" | sort -u | tr '\n' ':')"
            [[ "$actual_ids" == "$wanted_ids" ]] || queue_senders_verified=false
          done

          for worker in "$AZURE_GENERATION_WORKER_NAME:generation" "$AZURE_CONVERSION_WORKER_NAME:conversion"; do
            worker_name="${worker%%:*}"
            worker_kind="${worker##*:}"
            worker_state="$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$worker_name" --query "instanceView.state" --output tsv)"
            case "$worker_state" in
              Running|Stopped|Succeeded|Failed|Terminated) ;;
              *)
                echo "$worker_name is $worker_state. It is not an ACI state covered by the release policy." >&2
                exit 1
                ;;
            esac
            restart_policy="$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$worker_name" --query "restartPolicy" --output tsv)"
            command="$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$worker_name" --query "join(' ', containers[0].command)" --output tsv)"
            client_id="$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$worker_name" --query "containers[0].environmentVariables[?name=='AZURE_CLIENT_ID'].value | [0]" --output tsv)"
            if [[ "$restart_policy" != "Never" || "$command" != "python -m app.workers.aci_bootstrap $worker_kind" || -z "$client_id" ]]; then
              echo "$worker_name does not match the reviewed bootstrap contract; refusing to replace it." >&2
              exit 1
            fi
            identity_name="id-image-to-lego-${worker_kind}-dev"
            identity_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities/$identity_name"
            required_environment_names=(APP_ENV AZURE_STORAGE_ACCOUNT_URL AZURE_STORAGE_CONTAINER AZURE_SERVICE_BUS_NAMESPACE AZURE_SERVICE_BUS_QUEUE AZURE_SERVICE_BUS_GENERATION_QUEUE AZURE_CLIENT_ID AZURE_KEY_VAULT_URL DATABASE_URL_SECRET_NAME)
            if [[ "$worker_kind" == "generation" ]]; then
              required_environment_names+=(FAL_KEY_SECRET_NAME)
            else
              required_environment_names+=(AZURE_TOKEN_CREDENTIALS)
            fi
            actual_environment_names="$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$worker_name" --query 'containers[0].environmentVariables[].name' --output tsv | sort)"
            required_environment_names="$(printf '%s\n' "${required_environment_names[@]}" | sort)"
            secure_environment_names="$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$worker_name" --query 'containers[0].secureEnvironmentVariables[].name' --output tsv | sort)"
            worker_image="$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$worker_name" --query 'containers[0].image' --output tsv)"
            worker_image_tag="${worker_image##*:}"
            if [[ "$worker_image" != "$registry_server/image-to-lego-backend:"* || ! "$worker_image_tag" =~ ^[0-9a-f]{40}$ ]] || ! az acr repository show --name "$AZURE_ACR_NAME" --image "image-to-lego-backend:$worker_image_tag" --only-show-errors >/dev/null 2>&1; then
              echo "$worker_name has no recoverable immutable backend image; refusing to delete it." >&2
              exit 1
            fi
            if [[ "$actual_environment_names" != "$required_environment_names" || -n "$secure_environment_names" ]] || ! az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$worker_name" --output json | jq -e --arg identity "$identity_id" '(.identity.userAssignedIdentities | keys | map(ascii_downcase) == [$identity | ascii_downcase]) and (.imageRegistryCredentials | length == 1) and ((.imageRegistryCredentials[0].identity | ascii_downcase) == ($identity | ascii_downcase))' >/dev/null; then
              echo "$worker_name is missing part of the reviewed identity, ACR, or environment bootstrap contract." >&2
              exit 1
            fi
            action="$(pwsh ./scripts/Assert-WorkerReleaseSafety.ps1 -JobSubmissionsEnabled "$submissions_enabled" -ActiveWorkerAttempts "$active_attempts" -ActiveQueueMessages "$active_messages" -ScheduledQueueMessages "$scheduled_messages" -QueueSendersVerified "$queue_senders_verified" -WorkerState "$worker_state" -BootstrapContractMatches true)"
            echo "${worker_kind}_client_id=$client_id" >> "$GITHUB_OUTPUT"
            echo "${worker_kind}_action=$action" >> "$GITHUB_OUTPUT"
          done
      - name: Install Container Apps CLI extension
        if: steps.release-mode.outputs.enabled == 'true'
        shell: bash
        run: az extension add --name containerapp --upgrade --yes
      - name: Verify automatic-release tags are unused
        if: steps.release-mode.outputs.enabled == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for repository in image-to-lego-backend image-to-lego-frontend; do
            if az acr repository show --name "$AZURE_ACR_NAME" --image "$repository:$RELEASE_SHA" --only-show-errors >/dev/null 2>&1; then
              echo "Refusing to overwrite existing $repository:$RELEASE_SHA." >&2
              exit 1
            fi
          done
      - name: Log in to Azure Container Registry
        if: steps.release-mode.outputs.enabled == 'true' && github.event_name == 'push'
        run: az acr login --name "$AZURE_ACR_NAME"
      - name: Set up Docker Buildx
        if: steps.release-mode.outputs.enabled == 'true' && github.event_name == 'push'
        uses: docker/setup-buildx-action@v4
      - name: Build and publish immutable release images
        if: steps.release-mode.outputs.enabled == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          registry_server="$(az acr show --name "$AZURE_ACR_NAME" --query loginServer --output tsv)"
          docker buildx build --push --tag "$registry_server/image-to-lego-backend:$RELEASE_SHA" backend
          docker buildx build --push --file frontend/Dockerfile --tag "$registry_server/image-to-lego-frontend:$RELEASE_SHA" .
      - name: Resolve published release images
        if: steps.release-mode.outputs.enabled == 'true'
        id: images
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
          registry_server="$(az acr show --name "$AZURE_ACR_NAME" --query loginServer --output tsv)"
          backend_digest="$(az acr repository show --name "$AZURE_ACR_NAME" --image "image-to-lego-backend:$RELEASE_SHA" --query digest --output tsv)"
          frontend_digest="$(az acr repository show --name "$AZURE_ACR_NAME" --image "image-to-lego-frontend:$RELEASE_SHA" --query digest --output tsv)"
          echo "registry_server=$registry_server" >> "$GITHUB_OUTPUT"
          echo "backend_digest=$backend_digest" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$frontend_digest" >> "$GITHUB_OUTPUT"
      - name: Deploy API, workers, and frontend
        if: steps.release-mode.outputs.enabled == 'true'
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.images.outputs.registry_server }}
          GENERATION_CLIENT_ID: ${{ steps.preflight.outputs.generation_client_id }}
          CONVERSION_CLIENT_ID: ${{ steps.preflight.outputs.conversion_client_id }}
          GENERATION_ACTION: ${{ steps.preflight.outputs.generation_action }}
          CONVERSION_ACTION: ${{ steps.preflight.outputs.conversion_action }}
        run: |
          set -euo pipefail
          completed=()
          report_partial_release() {
            echo "### Partial release" >> "$GITHUB_STEP_SUMMARY"
            echo "Completed: ${completed[*]:-none}. Remaining components retain their prior image." >> "$GITHUB_STEP_SUMMARY"
            echo "Use workflow_dispatch with the previous approved 40-character SHA after resolving the failure." >> "$GITHUB_STEP_SUMMARY"
          }
          trap report_partial_release ERR
          backend_image="$REGISTRY_SERVER/image-to-lego-backend:$RELEASE_SHA"
          frontend_image="$REGISTRY_SERVER/image-to-lego-frontend:$RELEASE_SHA"
          identity_base="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities"

          az webapp config container set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_API_NAME" --container-image-name "$backend_image" --container-registry-url "https://$REGISTRY_SERVER"
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_API_NAME"
          completed+=("API")

          if [[ "$GENERATION_ACTION" == "recreate" ]]; then
            az container delete --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_GENERATION_WORKER_NAME" --yes
          fi
          az container create --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_GENERATION_WORKER_NAME" --image "$backend_image" --os-type Linux --cpu 1 --memory 2 --restart-policy Never --ip-address None --assign-identity "$identity_base/id-image-to-lego-generation-dev" --acr-identity "$identity_base/id-image-to-lego-generation-dev" --registry-login-server "$REGISTRY_SERVER" --command-line python -m app.workers.aci_bootstrap generation --environment-variables "APP_ENV=development" "AZURE_STORAGE_ACCOUNT_URL=https://storageimgtolego.blob.core.windows.net" "AZURE_STORAGE_CONTAINER=artifacts" "AZURE_SERVICE_BUS_NAMESPACE=image-to-lego-bus-dev-01.servicebus.windows.net" "AZURE_SERVICE_BUS_QUEUE=conversion" "AZURE_SERVICE_BUS_GENERATION_QUEUE=generation" "AZURE_CLIENT_ID=$GENERATION_CLIENT_ID" "AZURE_KEY_VAULT_URL=$AZURE_KEY_VAULT_URL" "DATABASE_URL_SECRET_NAME=database-url" "FAL_KEY_SECRET_NAME=fal-key"
          completed+=("generation worker")
          if [[ "$CONVERSION_ACTION" == "recreate" ]]; then
            az container delete --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONVERSION_WORKER_NAME" --yes
          fi
          az container create --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONVERSION_WORKER_NAME" --image "$backend_image" --os-type Linux --cpu 1 --memory 2 --restart-policy Never --ip-address None --assign-identity "$identity_base/id-image-to-lego-conversion-dev" --acr-identity "$identity_base/id-image-to-lego-conversion-dev" --registry-login-server "$REGISTRY_SERVER" --command-line python -m app.workers.aci_bootstrap conversion --environment-variables "APP_ENV=development" "AZURE_STORAGE_ACCOUNT_URL=https://storageimgtolego.blob.core.windows.net" "AZURE_STORAGE_CONTAINER=artifacts" "AZURE_SERVICE_BUS_NAMESPACE=image-to-lego-bus-dev-01.servicebus.windows.net" "AZURE_SERVICE_BUS_QUEUE=conversion" "AZURE_SERVICE_BUS_GENERATION_QUEUE=generation" "AZURE_CLIENT_ID=$CONVERSION_CLIENT_ID" "AZURE_KEY_VAULT_URL=$AZURE_KEY_VAULT_URL" "AZURE_TOKEN_CREDENTIALS=ManagedIdentityCredential" "DATABASE_URL_SECRET_NAME=database-url"
          completed+=("conversion worker")
          az containerapp update --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_NAME" --image "$frontend_image"
          completed+=("frontend")
      - name: Verify health and report versions
        if: steps.release-mode.outputs.enabled == 'true'
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.images.outputs.registry_server }}
          BACKEND_DIGEST: ${{ steps.images.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.images.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          api_hostname="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_API_NAME" --query defaultHostName --output tsv)"
          frontend_fqdn="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_NAME" --query properties.configuration.ingress.fqdn --output tsv)"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 15 "https://$api_hostname/health"; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "API health check did not succeed." >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 30 "https://$frontend_fqdn/" >/dev/null
          backend_image="$REGISTRY_SERVER/image-to-lego-backend:$RELEASE_SHA"
          frontend_image="$REGISTRY_SERVER/image-to-lego-frontend:$RELEASE_SHA"
          if ! az webapp config container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_API_NAME" --output json | grep --fixed-strings --quiet "$backend_image"; then
            echo "API image configuration does not report the requested release image." >&2
            exit 1
          fi
          if [[ "$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_NAME" --query 'properties.template.containers[0].image' --output tsv)" != "$frontend_image" ]]; then
            echo "Frontend image configuration does not report the requested release image." >&2
            exit 1
          fi
          for worker in "$AZURE_GENERATION_WORKER_NAME" "$AZURE_CONVERSION_WORKER_NAME"; do
            for attempt in {1..30}; do
              worker_state="$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$worker" --query "instanceView.state" --output tsv)"
              if [[ "$worker_state" == "Running" ]]; then
                break
              fi
              if [[ "$attempt" == "30" ]]; then
                echo "$worker did not start successfully (state: $worker_state)." >&2
                exit 1
              fi
              sleep 5
            done
            if [[ "$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$worker" --query 'containers[0].image' --output tsv)" != "$backend_image" ]]; then
              echo "$worker image configuration does not report the requested release image." >&2
              exit 1
            fi
          done
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Development deployment complete
          - Commit: \`$RELEASE_SHA\`
          - Backend image: \`$REGISTRY_SERVER/image-to-lego-backend:$RELEASE_SHA\` ($BACKEND_DIGEST)
          - Frontend image: \`$REGISTRY_SERVER/image-to-lego-frontend:$RELEASE_SHA\` ($FRONTEND_DIGEST)
          - API health: https://$api_hostname/health
          - Frontend: https://$frontend_fqdn/
          - Database migrations: not run by this workflow.
          EOF
